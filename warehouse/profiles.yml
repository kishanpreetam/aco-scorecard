aco_scorecard:
  target: local
  outputs:
    local:
      type: duckdb
      # Set by the Makefile and the Python runners to an absolute path; the default assumes
      # dbt is started from the repository root.
      path: "{{ env_var('ACO_WAREHOUSE', 'data/warehouse/aco.duckdb') }}"
      schema: main
      threads: 2
      settings:
        memory_limit: "{{ env_var('ACO_DUCKDB_MEMORY_LIMIT', '1GB') }}"
        threads: 2
        preserve_insertion_order: false
