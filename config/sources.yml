# Every URL below was found through the data.cms.gov catalog (https://data.cms.gov/data.json).
# Run `python -m aco_scorecard.download --discover` to re-read the catalog and report new
# or revised files. sha256 pins are written to config/pins.json after the first verified
# download; a later download whose hash differs stops the pipeline until someone reviews the
# change and reruns with --accept-changes.
#
# All files are aggregate, ACO-level (or ACO by county) public data. None contain
# beneficiary-level records. Small cells are suppressed by CMS before publication.

