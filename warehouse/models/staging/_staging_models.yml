# Generated by aco_scorecard/gen_staging.py. Do not edit by hand.
version: 2
models:
- name: stg_puf__py2013
  description: Typed, renamed PUF columns for period 2013 (one row per ACO).
  columns:
  - name: performance_period_id
    description: CMS performance period id (2019 and 2019A are separate files).
    data_tests: &id001
    - not_null
  - name: aco_source_id
    description: ACO identifier exactly as published. Encrypted ACO_Num through PY 2017, unencrypted ACO_ID from PY 2018.
    data_tests: &id002
    - not_null
    - unique
  - name: aco_name
    description: ACO doing business as name, or legal business name when no DBA exists.
  - name: aco_states_text
    description: States where at least 1 percent of assigned beneficiaries live, as published (full names through 2017, postal
      codes 2018 to 2021). Not published from 2022.
  - name: agreement_type
    description: Initial, Renewal or Re-entering agreement period. Published from PY 2016.
  - name: agreement_period_num
    description: Agreement period number (1 for the first agreement period). Published from PY 2016.
  - name: initial_start_date
    description: Start date of the ACO's first agreement period. PY 2013 to 2015 publish a single Start_Date, which is the
      initial start because no ACO had renewed yet.
  - name: current_start_date
    description: Start date of the current agreement period.
  - name: risk_model_reported
    description: One-Sided or Two-Sided as published. Published from PY 2019; earlier years derive it from the track.
  - name: assignment_type
    description: Prospective or Retrospective (preliminary prospective with retrospective reconciliation). Published from
      PY 2021.
  - name: snf_waiver_flag
    description: 1 if the ACO uses the skilled nursing facility 3-day rule waiver. Published from PY 2018.
  - name: six_month_flag
    description: 1 if the ACO was reconciled for a 6-month performance period in 2019.
  - name: revenue_category
    description: High Revenue or Low Revenue ACO (participant revenue versus 35 percent of assigned beneficiary spending).
      Published from PY 2018.
  - name: n_assigned_beneficiaries
    description: Number of assigned beneficiaries in the performance year.
  - name: person_years
    description: Assigned beneficiary person years (person months divided by 12).
  - name: total_benchmark_expenditures
    description: 'Total benchmark expenditures for the performance period (per capita benchmark times person years; prorated
      for 6-month periods, 18 or 21 months for 2012 starters in PY 2013). Unit: dollars.'
  - name: total_expenditures
    description: 'Total Parts A and B expenditures for assigned beneficiaries in the performance period. Unit: dollars.'
  - name: benchmark_minus_expenditures
    description: 'Total benchmark minus total expenditures. Positive values are savings, negative values are losses. Unit:
      dollars.'
  - name: savings_rate_reported
    description: 'Savings rate as published (benchmark minus expenditures over benchmark). Not published for PY 2013. Unit:
      fraction.'
  - name: min_savings_rate
    description: 'Minimum savings rate (MSR) the savings rate had to reach before the ACO could share in savings. Unit: fraction.'
  - name: generated_savings_losses
    description: 'Gross savings (or losses) generated, counted only when the savings rate met the MSR (or the loss rate met
      the MLR). Not published for PY 2013. Unit: dollars.'
  - name: earned_savings_losses
    description: 'Earned shared savings payment (positive) or shared losses owed (negative). PY 2013 publishes savings and
      losses in two columns, which are combined here. Unit: dollars.'
  - name: max_sharing_rate_reported
    description: 'Maximum sharing rate for the ACO''s track before quality (QualPerfShare through 2020, MaxShareRate in 2021).
      Not published from 2022. Unit: fraction.'
  - name: final_sharing_rate
    description: 'Share of savings the ACO kept after quality performance. Unit: fraction.'
  - name: final_loss_rate
    description: 'Share of losses a two-sided ACO owes. Published from PY 2023. Unit: fraction.'
  - name: updated_benchmark_per_capita
    description: 'Updated (risk adjusted and trended) per capita benchmark for the performance year. Published from PY 2014.
      Unit: dollars.'
  - name: historical_benchmark_per_capita
    description: 'Per capita historical benchmark set at the start of the agreement period. Published from PY 2014. Unit:
      dollars.'
  - name: per_capita_expenditure_reported
    description: 'Annualized per capita expenditure for assigned beneficiaries. Published from PY 2014; PY 2013 is derived
      from the enrollment type values in the intermediate layer. Unit: dollars.'
  - name: quality_score
    description: 'Quality score on a 0 to 100 scale. The definition changed in PY 2021 (APM Performance Pathway) and again
      in PY 2023 (health equity adjustment); see dim_performance_year. Unit: points_0_100.'
  - name: quality_score_raw
    description: Quality score text exactly as published (keeps values such as P4R, pay for reporting, in PY 2014).
  - name: met_quality_standard_flag
    description: 1 if the ACO met the quality performance standard. Published from PY 2016.
  - name: reduced_shared_savings_flag
    description: 1 if a low revenue ACO whose savings rate was below its MSR still qualified to share savings at a reduced
      rate (policy that starts in PY 2024).
  - name: pct_dual_eligible
    description: 'Share of assigned beneficiaries dually eligible for Medicare and Medicaid. Published from PY 2021. Unit:
      fraction.'
  - name: n_beneficiaries_age_0_64
    description: Assigned beneficiaries aged 0 to 64.
  - name: n_beneficiaries_age_65_74
    description: Assigned beneficiaries aged 65 to 74.
  - name: n_beneficiaries_age_75_84
    description: Assigned beneficiaries aged 75 to 84.
  - name: n_beneficiaries_age_85_plus
    description: Assigned beneficiaries aged 85 and older.
  - name: inpatient_discharges_per_1000
    description: Inpatient hospital discharges per 1
  - name: ed_visits_per_1000
    description: Outpatient emergency department visits per 1
  - name: primary_care_services_per_1000
    description: Primary care services per 1
  - name: pcp_services_per_1000
    description: Primary care services with a primary care physician per 1
  - name: n_primary_care_physicians
    description: Participating primary care physicians.
  - name: n_specialists
    description: Participating specialists.
  - name: person_years_esrd
    description: ESRD person years in the performance year.
  - name: person_years_disabled
    description: Disabled person years in the performance year.
  - name: person_years_aged_dual
    description: Aged dual eligible person years in the performance year.
  - name: person_years_aged_nondual
    description: Aged non-dual person years in the performance year.
  - name: per_capita_exp_esrd
    description: 'Annualized per capita expenditure for ESRD person years. Unit: dollars.'
  - name: per_capita_exp_disabled
    description: 'Annualized per capita expenditure for disabled person years. Unit: dollars.'
  - name: per_capita_exp_aged_dual
    description: 'Annualized per capita expenditure for aged dual person years. Unit: dollars.'
  - name: per_capita_exp_aged_nondual
    description: 'Annualized per capita expenditure for aged non-dual person years. Unit: dollars.'
  - name: risk_score_esrd
    description: Mean prospective CMS-HCC risk score
  - name: risk_score_disabled
    description: Mean prospective CMS-HCC risk score
  - name: risk_score_aged_dual
    description: Mean prospective CMS-HCC risk score
  - name: risk_score_aged_nondual
    description: Mean prospective CMS-HCC risk score
  - name: risk_score_esrd_by3
    description: Mean prospective CMS-HCC risk score
  - name: risk_score_disabled_by3
    description: Mean prospective CMS-HCC risk score
  - name: risk_score_aged_dual_by3
    description: Mean prospective CMS-HCC risk score
  - name: risk_score_aged_nondual_by3
    description: Mean prospective CMS-HCC risk score
  - name: person_years_esrd_by3
    description: ESRD person years in benchmark year 3. Published from PY 2014.
  - name: person_years_disabled_by3
    description: Disabled person years in benchmark year 3. Published from PY 2014.
  - name: person_years_aged_dual_by3
    description: Aged dual person years in benchmark year 3. Published from PY 2014.
  - name: person_years_aged_nondual_by3
    description: Aged non-dual person years in benchmark year 3. Published from PY 2014.
  - name: per_capita_exp_esrd_by3
    description: 'Per capita ESRD expenditure in benchmark year 3. Published from PY 2014. Unit: dollars.'
  - name: per_capita_exp_disabled_by3
    description: 'Per capita disabled expenditure in benchmark year 3. Published from PY 2014. Unit: dollars.'
  - name: per_capita_exp_aged_dual_by3
    description: 'Per capita aged dual expenditure in benchmark year 3. Published from PY 2014. Unit: dollars.'
  - name: per_capita_exp_aged_nondual_by3
    description: 'Per capita aged non-dual expenditure in benchmark year 3. Published from PY 2014. Unit: dollars.'
  - name: track_code
    description: Track decoded from the period's flag or code columns (see the tracks section of the mapping).
    data_tests: &id003
    - not_null
  - name: track_flag_count
    description: Number of track flags set; must be exactly 1.
    data_tests: &id004
    - accepted_values:
        arguments:
          values:
          - 1
          quote: false
