    description: 1 if the ACO uses the skilled nursing facility 3-day rule waiver. Published from PY 2018.
  - name: six_month_flag
    description: 1 if the ACO was reconciled for a 6-month performance period in 2019.
  - name: revenue_category
    description: High Revenue or Low Revenue ACO (participant revenue versus 35 percent of assigned beneficiary spending).
      Published from PY 2018.
  - name: n_assigned_beneficiaries
    description: Number of assigned beneficiaries in the performance year.
  - name: person_years
    description: Assigned beneficiary person years (person months divided by 12).
  - name: total_benchmark_expenditures
    description: 'Total benchmark expenditures for the performance period (per capita benchmark times person years; prorated
      for 6-month periods, 18 or 21 months for 2012 starters in PY 2013). Unit: dollars.'
  - name: total_expenditures
    description: 'Total Parts A and B expenditures for assigned beneficiaries in the performance period. Unit: dollars.'
  - name: benchmark_minus_expenditures
    description: 'Total benchmark minus total expenditures. Positive values are savings, negative values are losses. Unit:
      dollars.'
  - name: savings_rate_reported
    description: 'Savings rate as published (benchmark minus expenditures over benchmark). Not published for PY 2013. Unit:
      fraction.'
  - name: min_savings_rate
    description: 'Minimum savings rate (MSR) the savings rate had to reach before the ACO could share in savings. Unit: fraction.'
  - name: generated_savings_losses
    description: 'Gross savings (or losses) generated, counted only when the savings rate met the MSR (or the loss rate met
      the MLR). Not published for PY 2013. Unit: dollars.'
  - name: earned_savings_losses
    description: 'Earned shared savings payment (positive) or shared losses owed (negative). PY 2013 publishes savings and
      losses in two columns, which are combined here. Unit: dollars.'
  - name: max_sharing_rate_reported
    description: 'Maximum sharing rate for the ACO''s track before quality (QualPerfShare through 2020, MaxShareRate in 2021).
      Not published from 2022. Unit: fraction.'
  - name: final_sharing_rate
    description: 'Share of savings the ACO kept after quality performance. Unit: fraction.'
  - name: final_loss_rate
    description: 'Share of losses a two-sided ACO owes. Published from PY 2023. Unit: fraction.'
  - name: updated_benchmark_per_capita
